<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="652" viewBox="0 0 1000 652" role="img" aria-labelledby="title description">
  <title id="title">Flexible message delivery enables diverse use cases</title>
  <desc id="description">Read both conversation lines from left to right. Turn-based RAG: document, user, think, reply, wait, then a follow-up user, think, reply, and wait. Agentic: user, call, and think; a queue above the line holds a user update followed by a tool result. Both enter in that order when think closes. The same burst continues with think and reply until wait. Colours and labels distinguish message types; time is not to scale.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2E2F31"/></marker></defs>
  <rect width="1000" height="652" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#2E2F31">
<text x="500" y="44" font-size="27" font-weight="700" fill="#2E2F31" text-anchor="middle">Flexible message delivery enables diverse use cases</text>
<text x="32" y="91" font-size="23" font-weight="700" fill="#2E2F31" text-anchor="start">1. Turn-based conversation with RAG</text>
<text x="32" y="122" font-size="17" font-weight="400" fill="#2E2F31" text-anchor="start">Documents supply context; a follow-up user message starts another burst.</text>
